<style>
  :root{
    --ink:#0f1a2b; --muted:#5b6678; --bg:#f6f4ef; --card:#ffffff;
    --accent:#1f6f5c; --accent-2:#e9f3ef; --line:#e4e0d6; --warn:#c2552d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,sans-serif;
       color:var(--ink);background:var(--bg);line-height:1.55;-webkit-font-smoothing:antialiased}
  a{color:inherit}
  .wrap{max-width:1080px;margin:0 auto;padding:0 22px}

  /* Nav */
  nav{display:flex;align-items:center;justify-content:space-between;padding:20px 0}
  .logo{font-weight:800;letter-spacing:.08em;font-size:20px;text-decoration:none}
  .logo span{color:var(--accent)}
  .lang{display:flex;gap:4px;background:#ebe7de;border-radius:999px;padding:3px}
  .lang button{border:0;background:transparent;font:inherit;font-size:13px;font-weight:600;
       padding:6px 12px;border-radius:999px;cursor:pointer;color:var(--muted)}
  .lang button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.08)}

  /* Hero */
  .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:center;padding:48px 0 72px}
  .eyebrow{display:inline-block;font-size:13px;font-weight:600;color:var(--accent);
       background:var(--accent-2);padding:6px 12px;border-radius:999px;margin-bottom:20px}
  h1{font-size:clamp(36px,5.4vw,58px);line-height:1.05;letter-spacing:-.02em;font-weight:800;margin-bottom:20px}
  h1 em{font-style:normal;color:var(--accent)}
  .lead{font-size:clamp(17px,2vw,20px);color:var(--muted);max-width:34ch;margin-bottom:30px}
  .cta{display:flex;flex-wrap:wrap;gap:14px;align-items:center}
  .store{display:inline-flex;align-items:center;gap:10px;background:var(--ink);color:#fff;
       text-decoration:none;padding:13px 22px;border-radius:14px;font-weight:600}
  .store svg{width:22px;height:22px;fill:#fff}
  .store small{display:block;font-size:11px;font-weight:500;opacity:.75;line-height:1}
  .store b{display:block;font-size:17px;line-height:1.15}
  .trial{font-size:14px;color:var(--muted)}

  /* Phone mock */
  .phone{justify-self:center;width:290px;aspect-ratio:9/19;background:var(--ink);border-radius:46px;
       padding:12px;box-shadow:0 30px 60px -20px rgba(15,26,43,.35)}
  .screen{background:#fbfaf7;border-radius:36px;height:100%;overflow:hidden;padding:44px 16px 16px;position:relative}
  .screen:before{content:"";position:absolute;top:12px;left:50%;transform:translateX(-50%);
       width:90px;height:24px;background:var(--ink);border-radius:20px}
  .s-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:4px}
  .s-head b{font-size:22px}
  .s-head span{font-size:12px;color:var(--muted)}
  .s-sum{background:var(--accent);color:#fff;border-radius:16px;padding:14px;margin:12px 0}
  .s-sum small{opacity:.8;font-size:11px}
  .s-sum div{font-size:24px;font-weight:700}
  .s-sum p{font-size:11px;opacity:.85}
  .row{display:flex;justify-content:space-between;align-items:center;background:#fff;border:1px solid var(--line);
       border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:13px}
  .row i{font-style:normal;font-size:11px;color:var(--muted);display:block}
  .row .ok{color:var(--accent);font-weight:700}
  .row .miss{color:var(--warn);font-weight:700}

  /* Sections */
  section{padding:72px 0}
  h2{font-size:clamp(28px,3.6vw,40px);letter-spacing:-.015em;line-height:1.15;margin-bottom:14px}
  .sub{color:var(--muted);font-size:18px;max-width:52ch}
  .problem{background:var(--ink);color:#fff;border-radius:28px;padding:56px 48px;margin:0 0 20px}
  .problem .sub{color:#b8c1cf}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px}
  .step{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:28px}
  .num{width:36px;height:36px;border-radius:50%;background:var(--accent-2);color:var(--accent);
       display:grid;place-items:center;font-weight:800;margin-bottom:16px}
  .step h3{font-size:19px;margin-bottom:6px}
  .step p{color:var(--muted);font-size:15px}
  .feats{display:grid;grid-template-columns:repeat(2,1fr);gap:16px 40px;margin-top:36px}
  .feat{display:flex;gap:14px}
  .feat .ic{flex:none;width:28px;height:28px;border-radius:8px;background:var(--accent);color:#fff;
       display:grid;place-items:center;font-size:15px;font-weight:700}
  .feat h4{font-size:17px}
  .feat p{color:var(--muted);font-size:15px}

  /* Pricing */
  .price{background:var(--card);border:1px solid var(--line);border-radius:28px;padding:44px;
       display:grid;grid-template-columns:1fr auto;gap:30px;align-items:center}
  .amount{font-size:52px;font-weight:800;letter-spacing:-.02em}
  .amount span{font-size:18px;font-weight:600;color:var(--muted)}
  .price ul{list-style:none;margin-top:14px}
  .price li{padding:4px 0;color:var(--muted)}
  .price li:before{content:"✓  ";color:var(--accent);font-weight:700}

  /* FAQ */
  details{border-bottom:1px solid var(--line);padding:18px 0}
  summary{font-weight:600;font-size:17px;cursor:pointer;list-style:none;display:flex;justify-content:space-between}
  summary::-webkit-details-marker{display:none}
  summary:after{content:"+";color:var(--accent);font-size:22px;line-height:1}
  details[open] summary:after{content:"–"}
  details p{color:var(--muted);margin-top:10px;max-width:65ch}

  footer{padding:48px 0 60px;color:var(--muted);font-size:14px;border-top:1px solid var(--line);margin-top:40px}
  footer .wrap{display:flex;justify-content:space-between;flex-wrap:wrap;gap:16px}
  footer a{text-decoration:none;margin-left:18px}

  .lang button{padding:6px 10px}
  @media (max-width:520px){ .lang button{padding:6px 7px;font-size:12px} nav{gap:10px} }

  @media (max-width:820px){
    .hero{grid-template-columns:1fr;padding-top:24px;gap:40px}
    .steps,.feats{grid-template-columns:1fr}
    .problem{padding:40px 26px;border-radius:22px}
    .price{grid-template-columns:1fr;padding:30px}
    section{padding:52px 0}
    footer a{margin:0 18px 0 0}
  }
</style>
</head>

function setLang(l){
  if(!T[l]) l='en';
  var d=T[l];
  document.documentElement.lang=l;
  document.title=d.title;
  var els=document.querySelectorAll('[data-i18n]');
  for(var i=0;i<els.length;i++){ var k=els[i].getAttribute('data-i18n'); els[i].innerHTML=(d[k]!==undefined?d[k]:T.en[k]); }
  var bs=document.querySelectorAll('.lang button');
  for(var j=0;j<bs.length;j++) bs[j].classList.toggle('on', bs[j].getAttribute('data-l')===l);
  try{ localStorage.setItem('kvitz-lang', l); }catch(e){}
}

(function(){
  var l=null;
  try{ l=new URLSearchParams(location.search).get('lang'); }catch(e){}
  if(!l){ try{ l=localStorage.getItem('kvitz-lang'); }catch(e){} }
  if(!l){
    var n=(navigator.language||'en').toLowerCase().slice(0,2);
    l = n==='sv' ? 'sv' : (n==='nb'||n==='nn'||n==='no') ? 'no' : n==='da' ? 'da' : n==='fi' ? 'fi' : 'en';
  }
  setLang(l);
})();
